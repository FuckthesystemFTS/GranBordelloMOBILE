name: Publish verified signed APK 3.0.5
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-android-305
  cancel-in-progress: false
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reconstruct byte-exact signed APK from public release data
        env:
          DELTA_SHA: ec3ffd81153123a13c5fcfd0a22257a775c1b7b585a434b4bbdbb8184038d964
          TARGET_SHA: b2519925ce27711e406cf3bba5ebc1465ed22cd1457b19fb704bd39c2d2568ea
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          def sha(path):
              with open(path,'rb') as stream:return hashlib.file_digest(stream,'sha256').hexdigest()
          def download(url,path):
              subprocess.run(['curl','--fail','--silent','--show-error','--location','--retry','3','--connect-timeout','20','--max-time','1200',url,'-o',path],check=True)
          download('https://granbordello.it/downloads/GranBordelloMOBILE-3.0.5-publication-delta.zip','delta.zip')
          assert sha('delta.zip')==os.environ['DELTA_SHA']
          with zipfile.ZipFile('delta.zip') as z:
              metadata=json.loads(z.read('segments.json'))
              with z.open('literals.bin') as source,open('literals.bin','wb') as dest:
                  import shutil;shutil.copyfileobj(source,dest)
          assert metadata['newSha256']==os.environ['TARGET_SHA']
          assert metadata['oldUrl']=='https://github.com/FuckthesystemFTS/GranBordelloMOBILE/releases/download/v3.0.4/GranBordelloMOBILE-3.0.4.apk'
          download(metadata['oldUrl'],'previous.apk')
          assert sha('previous.apk')==metadata['oldSha256']
          result='GranBordelloMOBILE-3.0.5.apk'
          with open('previous.apk','rb') as previous,open('literals.bin','rb') as literal,open(result,'wb') as out:
              for segment in metadata['segments']:
                  assert segment['source'] in ('old','new')
                  source=previous if segment['source']=='old' else literal
                  start,length=segment['start'],segment['length']
                  assert start>=0 and length>0 and start+length<=os.fstat(source.fileno()).st_size
                  source.seek(start)
                  while length:
                      block=source.read(min(length,1048576));assert block;out.write(block);length-=len(block)
          assert pathlib.Path(result).stat().st_size==metadata['bytes']
          assert sha(result)==os.environ['TARGET_SHA']
          print('PASS signed APK reconstructed with original SHA-256:',os.environ['TARGET_SHA'])
          PY
      - name: Verify and reconstruct Windows installer
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,subprocess,concurrent.futures
          parts=json.loads('[{"name": "Windows-relay-3.0.5-0.bin", "bytes": 67108864, "sha256": "3cd015fc837bf6d710c79e9d26894f84aacec658772082a190f57dd9c3a7791f"}, {"name": "Windows-relay-3.0.5-1.bin", "bytes": 67108864, "sha256": "6dc5a712374e83339c8b98bdd8aa8620df78e9591f811f98b71eba77027fcdd1"}, {"name": "Windows-relay-3.0.5-2.bin", "bytes": 20717813, "sha256": "aeac729a01151fd188d1b06bfe1e62b477b7eb62cd1b0e6f35de4cb8d36ce9a4"}]')
          def download(p):
              subprocess.run(['curl','-fLsS','--retry','5','--connect-timeout','20','--max-time','1800','https://granbordello.it/downloads/'+p['name'],'-o',p['name']],check=True)
              with open(p['name'],'rb')as f:assert hashlib.file_digest(f,'sha256').hexdigest()==p['sha256']
              assert pathlib.Path(p['name']).stat().st_size==p['bytes']
          with concurrent.futures.ThreadPoolExecutor(max_workers=4)as pool:list(pool.map(download,parts))
          with open('Patch-PS2-GT3-v3.0.5-los-bordellos-online.exe','wb')as dest:
              for p in parts:
                  with open(p['name'],'rb')as f:
                      import shutil;shutil.copyfileobj(f,dest)
          with open('Patch-PS2-GT3-v3.0.5-los-bordellos-online.exe','rb')as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='897afdfc0e349bf5b9b0c6ab0e227bdc44f4381da355ff557a6f3697b6afb654'
          PY
      - name: Publish verified Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v3.0.5 Patch-PS2-GT3-v3.0.5-los-bordellos-online.exe --repo FuckthesystemFTS/GranBordelloMOBILE --clobber
      - name: Publish original signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v3.0.5 GranBordelloMOBILE-3.0.5.apk --repo FuckthesystemFTS/GranBordelloMOBILE --clobber
